<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════════
  SPEECH-TO-TEXT PWA  —  Install instructions
  ════════════════════════════════════════════════════════════════════════
  ANDROID (Chrome):
  1. Deploy to Vercel (drag this folder to vercel.com/new)
  2. Open the deployed URL in Chrome on your Galaxy
  3. Tap the three-dot menu → "Install app" (or "Add to Home screen")
  4. It installs as a WebAPK — appears in your app drawer like a real app
  5. Long-press the home screen icon → "Record" shortcut to record instantly

  iPHONE (Safari — must be Safari, not Chrome):
  1. Open the deployed URL in Safari
  2. Tap the Share button (square with an up-arrow)
  3. Scroll down → "Add to Home Screen" → Add
  4. It launches full-screen from the home screen like a real app
     (Note: iOS doesn't support the long-press "Record" shortcut — that's
      an Android-only feature.)
  ════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Voice → Text" />
  <meta name="application-name" content="Voice → Text" />
  <title>Voice → Text</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root {
      --accent: #7c5cff;
      --accent-2: #b18cff;
      --rec: #ff4d6d;
      --card-w: 440px;
      --radius: 30px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      /* A real dark app background now that this isn't a tiny floating widget. */
      background:
        radial-gradient(900px 600px at 50% -10%, rgba(124, 92, 255, 0.16), transparent 60%),
        radial-gradient(700px 500px at 100% 110%, rgba(177, 140, 255, 0.10), transparent 55%),
        #08080c;
      background-attachment: fixed;
      color: #f4f4f6;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Center the card on screen, with safe-area-aware padding. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(18px, env(safe-area-inset-top))
               max(18px, env(safe-area-inset-right))
               max(18px, env(safe-area-inset-bottom))
               max(18px, env(safe-area-inset-left));
    }

    /* ─────────────────────────  Card  ───────────────────────── */
    .widget {
      width: var(--card-w);
      max-width: 100%;
      padding: 26px 26px 30px;
      border-radius: var(--radius);
      background: rgba(18, 18, 24, 0.72);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7),
                  inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: pop 0.35s cubic-bezier(0.2, 0.9, 0.25, 1.2);
    }

    @keyframes pop {
      from { transform: translateY(14px) scale(0.96); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* ─────────────────────────  Top bar  ─────────────────────────────── */
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #d8d8e6;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .title .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border: none;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.05);
      color: #c9c9d6;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s, color 0.18s;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .icon-btn:active { transform: scale(0.88); }
    .icon-btn.on { color: var(--accent-2); background: rgba(124, 92, 255, 0.18); }
    .icon-btn svg { width: 22px; height: 22px; }

    /* ─────────────────────────  Mic button  ─────────────────────────── */
    .mic-wrap {
      display: grid;
      place-items: center;
      padding: 16px 0 6px;
    }
    .mic {
      position: relative;
      width: 132px; height: 132px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: radial-gradient(circle at 30% 25%, var(--accent-2), var(--accent) 70%);
      color: #fff;
      display: grid; place-items: center;
      box-shadow: 0 16px 40px -8px rgba(124, 92, 255, 0.6);
      transition: transform 0.14s ease;
    }
    .mic:active { transform: scale(0.93); }
    .mic svg { width: 54px; height: 54px; z-index: 2; }

    .mic.recording {
      background: radial-gradient(circle at 30% 25%, #ff7d96, var(--rec) 70%);
      box-shadow: 0 16px 40px -8px rgba(255, 77, 109, 0.65);
      animation: glow 1.4s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.55), 0 16px 40px -8px rgba(255, 77, 109, 0.65); }
      50%      { box-shadow: 0 0 0 22px rgba(255, 77, 109, 0), 0 16px 40px -8px rgba(255, 77, 109, 0.65); }
    }

    /* spinner shown while transcribing */
    .mic.busy { pointer-events: none; opacity: 0.85; }
    .spinner {
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      margin-top: 16px;
      font-size: 14px;
      color: #9a9aab;
      text-align: center;
      min-height: 18px;
    }

    /* ─────────────────────────  Waveform  ───────────────────────────── */
    .wave {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 38px;
      margin-top: 14px;
    }
    .wave.active { display: flex; }
    .wave i {
      width: 4px;
      border-radius: 4px;
      background: linear-gradient(var(--accent-2), var(--accent));
      animation: bounce 1s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { height: 8px; opacity: 0.5; }
      50%      { height: 36px; opacity: 1; }
    }

    /* ─────────────────────────  Result  ─────────────────────────────── */
    .result {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      animation: fade 0.3s ease;
    }
    .result.show { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(124, 92, 255, 0.18);
      color: var(--accent-2);
      border: 1px solid rgba(124, 92, 255, 0.3);
    }
    .text {
      font-size: 17px;
      line-height: 1.55;
      color: #ececf2;
      max-height: 240px;
      overflow-y: auto;
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
    }
    .copy-btn {
      width: 38px; height: 38px;
      flex: 0 0 auto;
      display: grid; place-items: center;
      border: none; border-radius: 11px;
      background: rgba(255, 255, 255, 0.06);
      color: #c9c9d6; cursor: pointer;
      transition: transform 0.12s, background 0.18s, color 0.18s;
    }
    .copy-btn:active { transform: scale(0.85); }
    .copy-btn.done { color: #4ade80; background: rgba(74, 222, 128, 0.16); }
    .copy-btn svg { width: 18px; height: 18px; }

    /* ─────────────────────────  History panel  ─────────────────────── */
    .history {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      max-height: 360px;
      overflow-y: auto;
      animation: fade 0.3s ease;
    }
    .history.show { display: block; }
    .history h4 {
      margin: 0 0 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8a8a9a;
    }
    .h-item {
      padding: 12px 13px;
      margin-bottom: 9px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .h-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .h-meta { font-size: 11.5px; color: #80808f; display: flex; gap: 8px; align-items: center; }
    .h-text {
      font-size: 14.5px;
      line-height: 1.5;
      color: #d6d6e0;
      -webkit-user-select: text; user-select: text;
      word-break: break-word;
    }
    .h-empty { font-size: 13.5px; color: #75758a; text-align: center; padding: 14px 0; }

    /* ─────────────────────────  Settings  ───────────────────────────── */
    .settings {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      animation: fade 0.3s ease;
    }
    .settings.show { display: block; }
    .settings label {
      display: block;
      font-size: 13px;
      color: #9a9aab;
      margin-bottom: 8px;
    }
    .settings input {
      width: 100%;
      padding: 13px 14px;
      font-size: 15px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      outline: none;
      transition: border 0.18s;
    }
    .settings input:focus { border-color: var(--accent); }
    .save-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: #fff;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.18s;
    }
    .save-btn:active { transform: scale(0.97); }
    .settings .note { font-size: 12px; color: #75758a; margin-top: 10px; line-height: 1.45; }

    /* first-run gate hides the mic until a key exists */
    body.no-key .mic-wrap, body.no-key .hint { display: none; }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 20, 28, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f0f0f5;
      font-size: 12.5px;
      padding: 9px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 5px; }
  </style>
</head>
<body class="no-key">
  <div class="widget">
    <div class="bar">
      <div class="title"><span class="dot"></span> Voice → Text</div>
      <div class="actions">
        <button class="icon-btn" id="uploadBtn" title="Upload a voice recording" aria-label="Upload a voice recording">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        </button>
        <button class="icon-btn" id="histBtn" title="History" aria-label="History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-btn" id="gearBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <!-- Mic -->
    <div class="mic-wrap">
      <button class="mic" id="mic" aria-label="Record">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10a7 7 0 0 1-14 0M12 19v3"/></svg>
      </button>
    </div>
    <div class="wave" id="wave"></div>
    <div class="hint" id="hint">Tap to record</div>
    <input id="fileInput" type="file" accept="audio/*" hidden />

    <!-- Result -->
    <div class="result" id="result">
      <div class="result-head">
        <span class="badge" id="badge">—</span>
        <button class="copy-btn" id="copyBtn" title="Copy" aria-label="Copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>
      <div class="text" id="text"></div>
    </div>

    <!-- History -->
    <div class="history" id="history">
      <h4>Recent</h4>
      <div id="histList"></div>
    </div>

    <!-- Settings -->
    <div class="settings" id="settings">
      <label for="keyInput">OpenAI API Key</label>
      <input id="keyInput" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
      <button class="save-btn" id="saveKey">Save key</button>
      <div class="note">Stored only in this device's localStorage. Used directly with api.openai.com — never sent anywhere else.</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (() => {
    "use strict";

    // ───────────────────────── constants / state ─────────────────────────
    const KEY_STORE  = "stt_openai_key";
    const HIST_STORE = "stt_history";
    const API_URL    = "https://api.openai.com/v1/audio/transcriptions";
    const MODEL      = "gpt-4o-transcribe";
    const RTL_LANGS  = new Set(["hebrew", "arabic", "persian", "urdu", "yiddish", "he", "ar", "fa", "ur"]);

    // Pretty labels + flags for common languages (best-effort; falls back gracefully)
    const LANG_INFO = {
      english:    ["🇬🇧", "English"],
      hebrew:     ["🇮🇱", "עברית"],
      arabic:     ["🇸🇦", "العربية"],
      spanish:    ["🇪🇸", "Español"],
      french:     ["🇫🇷", "Français"],
      german:     ["🇩🇪", "Deutsch"],
      russian:    ["🇷🇺", "Русский"],
      italian:    ["🇮🇹", "Italiano"],
      portuguese: ["🇵🇹", "Português"],
      dutch:      ["🇳🇱", "Nederlands"],
      chinese:    ["🇨🇳", "中文"],
      japanese:   ["🇯🇵", "日本語"],
      korean:     ["🇰🇷", "한국어"],
      hindi:      ["🇮🇳", "हिन्दी"],
      turkish:    ["🇹🇷", "Türkçe"],
      polish:     ["🇵🇱", "Polski"],
      ukrainian:  ["🇺🇦", "Українська"],
    };

    let mediaRecorder = null;
    let chunks = [];
    let recording = false;
    let stream = null;

    // ───────────────────────── element refs ─────────────────────────
    const $ = (id) => document.getElementById(id);
    const els = {
      mic: $("mic"), wave: $("wave"), hint: $("hint"),
      result: $("result"), badge: $("badge"), text: $("text"), copyBtn: $("copyBtn"),
      history: $("history"), histList: $("histList"), histBtn: $("histBtn"),
      settings: $("settings"), gearBtn: $("gearBtn"),
      keyInput: $("keyInput"), saveKey: $("saveKey"),
      uploadBtn: $("uploadBtn"), fileInput: $("fileInput"),
      toast: $("toast"),
    };

    // build waveform bars once
    for (let i = 0; i < 9; i++) {
      const b = document.createElement("i");
      b.style.animationDelay = (i * 0.09) + "s";
      els.wave.appendChild(b);
    }

    // ───────────────────────── helpers ─────────────────────────
    const getKey = () => localStorage.getItem(KEY_STORE) || "";
    const hasKey = () => !!getKey();

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function langBadge(lang) {
      if (!lang) return "🌐 —";
      const key = String(lang).toLowerCase();
      const info = LANG_INFO[key];
      if (info) return info[0] + " " + info[1];
      // capitalize unknown language name
      return "🌐 " + key.charAt(0).toUpperCase() + key.slice(1);
    }

    const isRTL = (lang) => RTL_LANGS.has(String(lang || "").toLowerCase());

    function closePanels(except) {
      if (except !== "history") { els.history.classList.remove("show"); els.histBtn.classList.remove("on"); }
      if (except !== "settings") { els.settings.classList.remove("show"); els.gearBtn.classList.remove("on"); }
    }

    // ───────────────────────── history ─────────────────────────
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HIST_STORE)) || []; }
      catch { return []; }
    }
    function saveHistory(arr) {
      localStorage.setItem(HIST_STORE, JSON.stringify(arr.slice(0, 10)));
    }
    function addHistory(entry) {
      const arr = loadHistory();
      arr.unshift(entry);
      saveHistory(arr);
      renderHistory();
    }
    function fmtTime(ts) {
      const d = new Date(ts);
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      return sameDay ? t : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + t;
    }
    function renderHistory() {
      const arr = loadHistory();
      if (!arr.length) {
        els.histList.innerHTML = '<div class="h-empty">No transcriptions yet</div>';
        return;
      }
      els.histList.innerHTML = "";
      arr.forEach((it) => {
        const item = document.createElement("div");
        item.className = "h-item";

        const top = document.createElement("div");
        top.className = "h-top";
        const meta = document.createElement("div");
        meta.className = "h-meta";
        meta.innerHTML = "<span>" + fmtTime(it.ts) + "</span><span>" + langBadge(it.lang) + "</span>";
        const cp = document.createElement("button");
        cp.className = "copy-btn";
        cp.innerHTML = copyIconSVG();
        cp.addEventListener("click", () => copyText(it.text, cp));
        top.appendChild(meta);
        top.appendChild(cp);

        const txt = document.createElement("div");
        txt.className = "h-text";
        txt.textContent = it.text;
        if (isRTL(it.lang)) txt.setAttribute("dir", "rtl");

        item.appendChild(top);
        item.appendChild(txt);
        els.histList.appendChild(item);
      });
    }
    const copyIconSVG = () =>
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const checkIconSVG = () =>
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

    async function copyText(str, btn) {
      try {
        await navigator.clipboard.writeText(str);
      } catch {
        // fallback for older webviews
        const ta = document.createElement("textarea");
        ta.value = str; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch {}
        document.body.removeChild(ta);
      }
      if (btn) {
        const orig = btn.innerHTML;
        btn.innerHTML = checkIconSVG();
        btn.classList.add("done");
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove("done"); }, 1200);
      }
    }

    // ───────────────────────── recording ─────────────────────────
    function pickMime() {
      const prefs = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      for (const m of prefs) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
      }
      return "";
    }

    async function startRecording() {
      if (!hasKey()) { openSettings(); toast("Enter your API key first"); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        toast("Microphone access denied");
        return;
      }
      const mime = pickMime();
      try {
        mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }
      chunks = [];
      mediaRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mediaRecorder.onstop = onStop;
      mediaRecorder.start();
      recording = true;

      els.mic.classList.add("recording");
      els.wave.classList.add("active");
      els.hint.textContent = "Listening… tap to stop";
      closePanels();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      recording = false;
      els.mic.classList.remove("recording");
      els.wave.classList.remove("active");
    }

    function stopStream() {
      if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    }

    async function onStop() {
      const type = (mediaRecorder && mediaRecorder.mimeType) || "audio/webm";
      const blob = new Blob(chunks, { type });
      stopStream();
      if (!blob.size) { els.hint.textContent = "Nothing recorded — tap to retry"; return; }
      processAudio(blob, type, "audio." + ext(type));
    }

    // Shared by live recording and the upload button.
    async function processAudio(blob, type, filename) {
      if (!hasKey()) { openSettings(); toast("Enter your API key first"); return; }
      if (!blob || !blob.size) { toast("That file looks empty"); return; }

      els.mic.classList.add("busy");
      const sp = document.createElement("div");
      sp.className = "spinner";
      els.mic.appendChild(sp);
      els.hint.textContent = "Transcribing…";

      try {
        const out = await transcribe(blob, type, filename);
        showResult(out.text || "", out.language || "");
        if (out.text) {
          addHistory({ text: out.text, lang: out.language || "", ts: Date.now() });
        }
        els.hint.textContent = "Tap to record";
      } catch (err) {
        console.error(err);
        toast(err.message || "Transcription failed");
        els.hint.textContent = "Failed — tap to retry";
      } finally {
        els.mic.classList.remove("busy");
        sp.remove();
      }
    }

    function ext(type) {
      if (type.includes("mp4") || type.includes("m4a") || type.includes("aac")) return "mp4";
      if (type.includes("mpeg") || type.includes("mp3")) return "mp3";
      if (type.includes("wav")) return "wav";
      if (type.includes("ogg")) return "ogg";
      return "webm";
    }

    async function transcribe(blob, type, filename) {
      const fd = new FormData();
      fd.append("file", blob, filename || ("audio." + ext(type)));
      fd.append("model", MODEL);
      fd.append("response_format", "json");
      // NOTE: intentionally no `language` param — let the model auto-detect.

      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Authorization": "Bearer " + getKey() },
        body: fd,
      });

      if (!res.ok) {
        let msg = "API error " + res.status;
        try {
          const j = await res.json();
          if (j.error && j.error.message) msg = j.error.message;
        } catch {}
        if (res.status === 401) msg = "Invalid API key";
        throw new Error(msg);
      }
      return res.json();
    }

    function showResult(text, lang) {
      els.badge.textContent = langBadge(lang);
      els.text.textContent = text;
      if (isRTL(lang)) els.text.setAttribute("dir", "rtl");
      else els.text.removeAttribute("dir");
      els.result.classList.add("show");
      closePanels();
    }

    // ───────────────────────── settings ─────────────────────────
    function openSettings() {
      closePanels("settings");
      els.keyInput.value = getKey();
      els.settings.classList.add("show");
      els.gearBtn.classList.add("on");
      setTimeout(() => els.keyInput.focus(), 50);
    }

    // ───────────────────────── events ─────────────────────────
    els.mic.addEventListener("click", () => {
      if (recording) stopRecording();
      else startRecording();
    });

    els.copyBtn.addEventListener("click", () => copyText(els.text.textContent, els.copyBtn));

    // Upload a voice recording instead of recording live.
    els.uploadBtn.addEventListener("click", () => {
      if (!hasKey()) { openSettings(); toast("Enter your API key first"); return; }
      els.fileInput.click();
    });
    els.fileInput.addEventListener("change", () => {
      const f = els.fileInput.files && els.fileInput.files[0];
      if (!f) return;
      closePanels();
      els.result.classList.remove("show");
      processAudio(f, f.type || "", f.name || ("audio." + ext(f.type || "")));
      els.fileInput.value = "";   // allow re-picking the same file
    });

    els.histBtn.addEventListener("click", () => {
      const show = !els.history.classList.contains("show");
      closePanels("history");
      els.history.classList.toggle("show", show);
      els.histBtn.classList.toggle("on", show);
      if (show) renderHistory();
    });

    els.gearBtn.addEventListener("click", () => {
      if (els.settings.classList.contains("show")) closePanels();
      else openSettings();
    });

    els.saveKey.addEventListener("click", () => {
      const v = els.keyInput.value.trim();
      if (!v) { toast("Paste a key first"); return; }
      localStorage.setItem(KEY_STORE, v);
      document.body.classList.remove("no-key");
      closePanels();
      toast("Key saved ✓");
    });
    els.keyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") els.saveKey.click(); });

    // ───────────────────────── init ─────────────────────────
    function init() {
      if (hasKey()) document.body.classList.remove("no-key");
      else { document.body.classList.add("no-key"); openSettings(); }

      renderHistory();

      // Deep-link: /?record=true → auto-start recording (from PWA shortcut)
      const params = new URLSearchParams(location.search);
      if (params.get("record") === "true" && hasKey()) {
        // slight delay so layout/permissions settle on cold start
        setTimeout(startRecording, 400);
      }
    }
    init();

    // ───────────────────────── service worker ─────────────────────────
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW failed", e));
      });
    }
  })();
  </script>
</body>
</html>
